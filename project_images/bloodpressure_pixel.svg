<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2634"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
  </defs>
  <!-- Background - Healer's cottage -->
  <rect width="320" height="200" fill="url(#bg5)"/>

  <!-- Wooden wall planks -->
  <g fill="#5d4e37">
    <rect x="0" y="0" width="320" height="8"/>
    <rect x="0" y="40" width="320" height="8"/>
    <rect x="0" y="80" width="320" height="8"/>
  </g>

  <!-- Window -->
  <rect x="240" y="20" width="60" height="50" fill="#1e3a5f"/>
  <rect x="244" y="24" width="24" height="20" fill="#3b82f6"/>
  <rect x="272" y="24" width="24" height="20" fill="#3b82f6"/>
  <rect x="244" y="48" width="24" height="18" fill="#3b82f6"/>
  <rect x="272" y="48" width="24" height="18" fill="#3b82f6"/>
  <!-- Curtains -->
  <rect x="240" y="16" width="60" height="8" fill="#7c2d12"/>

  <!-- Wooden floor -->
  <rect x="0" y="160" width="320" height="40" fill="#6b5b45"/>
  <g fill="#5d4e37">
    <rect x="0" y="160" width="40" height="40"/>
    <rect x="80" y="160" width="40" height="40"/>
    <rect x="160" y="160" width="40" height="40"/>
    <rect x="240" y="160" width="40" height="40"/>
  </g>

  <!-- Potion shelf -->
  <rect x="20" y="50" width="80" height="60" fill="#5d4e37"/>
  <rect x="24" y="54" width="72" height="8" fill="#4a3728"/>
  <rect x="24" y="74" width="72" height="8" fill="#4a3728"/>
  <rect x="24" y="94" width="72" height="8" fill="#4a3728"/>

  <!-- Potion bottles -->
  <g transform="translate(28, 38)">
    <rect x="0" y="8" width="10" height="14" fill="#dc2626"/>
    <rect x="2" y="4" width="6" height="6" fill="#7f1d1d"/>
  </g>
  <g transform="translate(44, 38)">
    <rect x="0" y="8" width="10" height="14" fill="#3b82f6"/>
    <rect x="2" y="4" width="6" height="6" fill="#1e3a5f"/>
  </g>
  <g transform="translate(60, 38)">
    <rect x="0" y="8" width="10" height="14" fill="#22c55e"/>
    <rect x="2" y="4" width="6" height="6" fill="#166534"/>
  </g>
  <g transform="translate(76, 38)">
    <rect x="0" y="8" width="10" height="14" fill="#eab308"/>
    <rect x="2" y="4" width="6" height="6" fill="#854d0e"/>
  </g>
  <!-- Second shelf potions -->
  <g transform="translate(30, 58)">
    <rect x="0" y="8" width="8" height="12" fill="#a855f7"/>
    <rect x="2" y="4" width="4" height="5" fill="#6b21a8"/>
  </g>
  <g transform="translate(50, 58)">
    <rect x="0" y="8" width="12" height="12" fill="#06b6d4"/>
    <rect x="3" y="4" width="6" height="5" fill="#164e63"/>
  </g>

  <!-- Heart-shaped health crystals -->
  <g transform="translate(140, 30)">
    <!-- Big heart crystal -->
    <rect x="4" y="0" width="8" height="8" fill="#dc2626"/>
    <rect x="16" y="0" width="8" height="8" fill="#dc2626"/>
    <rect x="0" y="4" width="28" height="12" fill="#dc2626"/>
    <rect x="4" y="16" width="20" height="8" fill="#dc2626"/>
    <rect x="8" y="24" width="12" height="8" fill="#dc2626"/>
    <rect x="12" y="32" width="4" height="4" fill="#dc2626"/>
    <!-- Shine -->
    <rect x="6" y="6" width="4" height="4" fill="#fca5a5"/>
    <!-- Glow -->
    <rect x="-4" y="-4" width="36" height="44" fill="#f87171" opacity="0.2"/>
  </g>

  <!-- Small floating hearts -->
  <g fill="#ef4444">
    <rect x="120" y="50" width="4" height="4"/>
    <rect x="124" y="46" width="4" height="4"/>
    <rect x="118" y="54" width="12" height="4"/>
    <rect x="122" y="58" width="4" height="4"/>
  </g>
  <g fill="#ef4444">
    <rect x="185" y="55" width="4" height="4"/>
    <rect x="189" y="51" width="4" height="4"/>
    <rect x="183" y="59" width="12" height="4"/>
    <rect x="187" y="63" width="4" height="4"/>
  </g>

  <!-- Pulse wave visualization screen -->
  <g transform="translate(180, 85)">
    <!-- Screen frame -->
    <rect x="0" y="0" width="100" height="60" fill="#1e293b"/>
    <rect x="4" y="4" width="92" height="52" fill="#0f172a"/>
    <!-- Pulse wave -->
    <g fill="#22c55e">
      <rect x="10" y="30" width="4" height="4"/>
      <rect x="18" y="28" width="4" height="4"/>
      <rect x="26" y="30" width="4" height="4"/>
      <rect x="34" y="32" width="4" height="4"/>
      <rect x="42" y="20" width="4" height="4"/>
      <rect x="46" y="12" width="4" height="8"/>
      <rect x="50" y="24" width="4" height="4"/>
      <rect x="54" y="36" width="4" height="4"/>
      <rect x="58" y="28" width="4" height="4"/>
      <rect x="66" y="30" width="4" height="4"/>
      <rect x="74" y="28" width="4" height="4"/>
      <rect x="82" y="30" width="4" height="4"/>
    </g>
    <!-- BPM display -->
    <rect x="70" y="8" width="24" height="12" fill="#dc2626"/>
    <text x="74" y="17" font-size="8" fill="#fff" font-family="monospace">72</text>
    <!-- Screen glow -->
    <rect x="-4" y="-4" width="108" height="68" fill="#22c55e" opacity="0.1"/>
  </g>

  <!-- Healer character -->
  <g transform="translate(100, 95)">
    <!-- Robe -->
    <rect x="4" y="24" width="32" height="48" fill="#f5f5f5"/>
    <rect x="8" y="28" width="24" height="40" fill="#e5e5e5"/>
    <!-- Red cross -->
    <rect x="16" y="32" width="8" height="24" fill="#dc2626"/>
    <rect x="10" y="40" width="20" height="8" fill="#dc2626"/>
    <!-- Head -->
    <rect x="10" y="4" width="20" height="20" fill="#ffccbc"/>
    <!-- Hair -->
    <rect x="8" y="0" width="24" height="8" fill="#92400e"/>
    <!-- Eyes -->
    <rect x="14" y="12" width="4" height="4" fill="#333"/>
    <rect x="22" y="12" width="4" height="4" fill="#333"/>
    <!-- Holding something -->
    <rect x="36" y="40" width="12" height="12" fill="#dc2626"/>
    <rect x="38" y="42" width="8" height="8" fill="#fca5a5"/>
  </g>

  <!-- Candle light -->
  <g transform="translate(40, 125)">
    <rect x="0" y="12" width="12" height="20" fill="#fef3c7"/>
    <rect x="4" y="4" width="4" height="10" fill="#f97316"/>
    <rect x="5" y="0" width="2" height="5" fill="#fbbf24"/>
  </g>

  <!-- Sparkle particles -->
  <g fill="#fef08a" opacity="0.8">
    <rect x="150" y="45" width="3" height="3"/>
    <rect x="170" y="60" width="3" height="3"/>
    <rect x="200" y="75" width="3" height="3"/>
    <rect x="260" y="90" width="3" height="3"/>
  </g>
</svg>