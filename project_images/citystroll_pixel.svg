<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3"/>
      <stop offset="100%" style="stop-color:#e8d4b8"/>
    </linearGradient>
  </defs>
  <!-- Background - Parchment map -->
  <rect width="320" height="200" fill="url(#bg7)"/>

  <!-- Map border/frame -->
  <rect x="8" y="8" width="304" height="184" fill="none" stroke="#8b7355" stroke-width="4"/>
  <rect x="12" y="12" width="296" height="176" fill="none" stroke="#a08060" stroke-width="2"/>

  <!-- Aged map texture lines -->
  <g stroke="#d4c4a8" stroke-width="1" opacity="0.5">
    <line x1="20" y1="30" x2="300" y2="30"/>
    <line x1="20" y1="60" x2="300" y2="60"/>
    <line x1="20" y1="90" x2="300" y2="90"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
  </g>

  <!-- Main roads -->
  <g fill="#c9b896">
    <!-- Horizontal main road -->
    <rect x="20" y="85" width="280" height="30"/>
    <!-- Vertical main road -->
    <rect x="145" y="20" width="30" height="160"/>
  </g>

  <!-- Road details/cobblestone pattern -->
  <g fill="#b8a785" opacity="0.6">
    <rect x="30" y="92" width="8" height="8"/>
    <rect x="50" y="100" width="8" height="8"/>
    <rect x="75" y="92" width="8" height="8"/>
    <rect x="100" y="100" width="8" height="8"/>
    <rect x="190" y="92" width="8" height="8"/>
    <rect x="220" y="100" width="8" height="8"/>
    <rect x="250" y="92" width="8" height="8"/>
    <rect x="275" y="100" width="8" height="8"/>
    <rect x="152" y="35" width="8" height="8"/>
    <rect x="160" y="55" width="8" height="8"/>
    <rect x="152" y="130" width="8" height="8"/>
    <rect x="160" y="150" width="8" height="8"/>
  </g>

  <!-- Walking path (dotted trail) -->
  <g fill="#dc2626">
    <rect x="35" y="97" width="6" height="6"/>
    <rect x="55" y="97" width="6" height="6"/>
    <rect x="75" y="97" width="6" height="6"/>
    <rect x="95" y="97" width="6" height="6"/>
    <rect x="115" y="97" width="6" height="6"/>
    <rect x="135" y="97" width="6" height="6"/>
    <rect x="156" y="97" width="6" height="6"/>
    <rect x="156" y="77" width="6" height="6"/>
    <rect x="156" y="57" width="6" height="6"/>
  </g>

  <!-- Store 1: Ramen Shop (top-left) -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="40" height="36" fill="#dc2626"/>
    <rect x="4" y="4" width="32" height="24" fill="#fef3c7"/>
    <!-- Roof -->
    <rect x="-4" y="-4" width="48" height="8" fill="#991b1b"/>
    <!-- Noren (curtain) -->
    <rect x="8" y="8" width="8" height="12" fill="#ffffff"/>
    <rect x="20" y="8" width="8" height="12" fill="#ffffff"/>
    <!-- Bowl icon -->
    <rect x="12" y="22" width="16" height="6" fill="#f97316"/>
    <!-- Label -->
    <rect x="4" y="32" width="32" height="8" fill="#fef3c7"/>
    <text x="8" y="39" font-size="6" fill="#991b1b" font-family="monospace">RAMEN</text>
  </g>

  <!-- Store 2: Cafe (top-right) -->
  <g transform="translate(250, 35)">
    <rect x="0" y="0" width="40" height="32" fill="#7c2d12"/>
    <rect x="4" y="4" width="32" height="20" fill="#fef3c7"/>
    <!-- Awning stripes -->
    <rect x="-4" y="-4" width="48" height="8" fill="#22c55e"/>
    <rect x="0" y="-4" width="8" height="8" fill="#ffffff"/>
    <rect x="16" y="-4" width="8" height="8" fill="#ffffff"/>
    <rect x="32" y="-4" width="8" height="8" fill="#ffffff"/>
    <!-- Coffee cup -->
    <rect x="14" y="8" width="12" height="10" fill="#6b4423"/>
    <rect x="12" y="6" width="16" height="4" fill="#ffffff"/>
    <!-- Label -->
    <rect x="4" y="26" width="32" height="8" fill="#fef3c7"/>
    <text x="10" y="33" font-size="6" fill="#7c2d12" font-family="monospace">CAFE</text>
  </g>

  <!-- Store 3: Bakery (bottom-left) -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="44" height="36" fill="#f59e0b"/>
    <rect x="4" y="4" width="36" height="24" fill="#fef3c7"/>
    <!-- Bread icon -->
    <rect x="10" y="10" width="24" height="12" fill="#d97706"/>
    <rect x="14" y="8" width="16" height="8" fill="#fbbf24"/>
    <!-- Window -->
    <rect x="8" y="8" width="28" height="16" fill="#fef9c3"/>
    <!-- Label -->
    <rect x="4" y="30" width="36" height="8" fill="#fef3c7"/>
    <text x="6" y="37" font-size="6" fill="#b45309" font-family="monospace">BAKERY</text>
  </g>

  <!-- Store 4: Sushi (right side) -->
  <g transform="translate(250, 125)">
    <rect x="0" y="0" width="44" height="36" fill="#1e40af"/>
    <rect x="4" y="4" width="36" height="24" fill="#fef3c7"/>
    <!-- Japanese style roof -->
    <rect x="-4" y="-6" width="52" height="10" fill="#1e3a8a"/>
    <rect x="0" y="-8" width="44" height="4" fill="#3b82f6"/>
    <!-- Sushi icon -->
    <rect x="12" y="10" width="20" height="10" fill="#ffffff"/>
    <rect x="16" y="8" width="12" height="6" fill="#f97316"/>
    <!-- Label -->
    <rect x="4" y="30" width="36" height="8" fill="#fef3c7"/>
    <text x="10" y="37" font-size="6" fill="#1e40af" font-family="monospace">SUSHI</text>
  </g>

  <!-- Store 5: Ice Cream (center-top) -->
  <g transform="translate(195, 30)">
    <rect x="0" y="0" width="36" height="32" fill="#ec4899"/>
    <rect x="4" y="4" width="28" height="20" fill="#fdf2f8"/>
    <!-- Ice cream cone -->
    <rect x="12" y="14" width="12" height="8" fill="#fbbf24"/>
    <rect x="10" y="6" width="16" height="10" fill="#f9a8d4"/>
    <rect x="14" y="2" width="8" height="6" fill="#ffffff"/>
    <!-- Label -->
    <rect x="2" y="26" width="32" height="8" fill="#fdf2f8"/>
    <text x="8" y="33" font-size="5" fill="#be185d" font-family="monospace">ICE</text>
  </g>

  <!-- Park/Garden area (center) -->
  <g transform="translate(100, 125)">
    <rect x="0" y="0" width="36" height="32" fill="#22c55e"/>
    <rect x="4" y="4" width="28" height="24" fill="#4ade80"/>
    <!-- Trees -->
    <rect x="8" y="8" width="8" height="8" fill="#166534"/>
    <rect x="10" y="4" width="4" height="6" fill="#15803d"/>
    <rect x="20" y="12" width="8" height="8" fill="#166534"/>
    <rect x="22" y="8" width="4" height="6" fill="#15803d"/>
    <!-- Bench -->
    <rect x="10" y="20" width="16" height="4" fill="#92400e"/>
  </g>

  <!-- Treasure/recommendation markers -->
  <g>
    <!-- Marker 1 - Star -->
    <rect x="45" y="56" width="12" height="12" fill="#fbbf24"/>
    <rect x="47" y="58" width="8" height="8" fill="#fef08a"/>
    <rect x="49" y="60" width="4" height="4" fill="#ffffff"/>

    <!-- Marker 2 - Star -->
    <rect x="263" y="72" width="12" height="12" fill="#fbbf24"/>
    <rect x="265" y="74" width="8" height="8" fill="#fef08a"/>
    <rect x="267" y="76" width="4" height="4" fill="#ffffff"/>

    <!-- Marker 3 - Star -->
    <rect x="156" y="38" width="12" height="12" fill="#fbbf24"/>
    <rect x="158" y="40" width="8" height="8" fill="#fef08a"/>
    <rect x="160" y="42" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- Player/You are here marker -->
  <g transform="translate(28, 90)">
    <rect x="0" y="0" width="16" height="20" fill="#dc2626"/>
    <rect x="2" y="2" width="12" height="12" fill="#fef08a"/>
    <rect x="4" y="4" width="8" height="8" fill="#dc2626"/>
    <!-- Pin point -->
    <rect x="6" y="16" width="4" height="6" fill="#dc2626"/>
  </g>

  <!-- Compass rose (top-right corner) -->
  <g transform="translate(270, 15)">
    <rect x="8" y="0" width="4" height="12" fill="#8b7355"/>
    <rect x="0" y="8" width="12" height="4" fill="#8b7355"/>
    <rect x="6" y="6" width="8" height="8" fill="#f5e6d3"/>
    <text x="8" y="0" font-size="6" fill="#5d4037" font-family="serif">N</text>
  </g>

  <!-- Map title scroll -->
  <g transform="translate(100, 165)">
    <rect x="0" y="0" width="120" height="20" fill="#f5deb3"/>
    <rect x="-8" y="2" width="16" height="16" fill="#d4b896"/>
    <rect x="112" y="2" width="16" height="16" fill="#d4b896"/>
    <text x="18" y="14" font-size="10" fill="#5d4037" font-family="serif" font-weight="bold">CITY STROLL</text>
  </g>

  <!-- Decorative corner flourishes -->
  <g fill="#a08060">
    <rect x="16" y="16" width="8" height="2"/>
    <rect x="16" y="16" width="2" height="8"/>
    <rect x="296" y="16" width="8" height="2"/>
    <rect x="304" y="16" width="2" height="8"/>
    <rect x="16" y="182" width="8" height="2"/>
    <rect x="16" y="176" width="2" height="8"/>
    <rect x="296" y="182" width="8" height="2"/>
    <rect x="304" y="176" width="2" height="8"/>
  </g>

  <!-- Distance scale -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="40" height="4" fill="#5d4037"/>
    <rect x="0" y="0" width="20" height="4" fill="#8b7355"/>
    <text x="0" y="12" font-size="5" fill="#5d4037" font-family="monospace">100m</text>
  </g>
</svg>