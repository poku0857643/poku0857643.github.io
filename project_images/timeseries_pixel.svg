<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>
  <!-- Background - Mystical night -->
  <rect width="320" height="200" fill="url(#bg4)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <rect x="20" y="15" width="2" height="2"/>
    <rect x="60" y="8" width="2" height="2"/>
    <rect x="100" y="20" width="2" height="2"/>
    <rect x="150" y="12" width="2" height="2"/>
    <rect x="200" y="18" width="2" height="2"/>
    <rect x="250" y="10" width="2" height="2"/>
    <rect x="290" y="22" width="2" height="2"/>
    <rect x="45" y="35" width="2" height="2"/>
    <rect x="270" y="30" width="2" height="2"/>
  </g>

  <!-- Fortune teller tent -->
  <g transform="translate(180, 40)">
    <!-- Tent top -->
    <polygon points="60,0 0,60 120,60" fill="#7c2d12"/>
    <polygon points="60,0 20,50 100,50" fill="#9a3412"/>
    <!-- Tent stripes -->
    <rect x="30" y="25" width="8" height="30" fill="#fbbf24"/>
    <rect x="50" y="15" width="8" height="40" fill="#fbbf24"/>
    <rect x="70" y="25" width="8" height="30" fill="#fbbf24"/>
    <!-- Tent opening -->
    <rect x="40" y="50" width="40" height="50" fill="#1a1a2e"/>
  </g>

  <!-- Oracle character -->
  <g transform="translate(210, 90)">
    <!-- Robe -->
    <rect x="0" y="24" width="32" height="40" fill="#4c1d95"/>
    <rect x="4" y="28" width="24" height="32" fill="#6d28d9"/>
    <!-- Head -->
    <rect x="6" y="4" width="20" height="20" fill="#ffccbc"/>
    <!-- Hood -->
    <rect x="2" y="0" width="28" height="16" fill="#4c1d95"/>
    <!-- Eyes (glowing) -->
    <rect x="10" y="10" width="4" height="4" fill="#c4b5fd"/>
    <rect x="18" y="10" width="4" height="4" fill="#c4b5fd"/>
    <!-- Hands raised -->
    <rect x="-8" y="32" width="8" height="8" fill="#ffccbc"/>
    <rect x="32" y="32" width="8" height="8" fill="#ffccbc"/>
  </g>

  <!-- Crystal ball with wave pattern -->
  <g transform="translate(100, 70)">
    <!-- Ball stand -->
    <rect x="16" y="60" width="32" height="12" fill="#5d4e37"/>
    <rect x="20" y="52" width="24" height="12" fill="#6b5b45"/>
    <!-- Crystal ball -->
    <rect x="8" y="8" width="48" height="48" fill="#1e1b4b"/>
    <rect x="12" y="12" width="40" height="40" fill="#312e81"/>
    <rect x="16" y="16" width="32" height="32" fill="#4338ca"/>
    <!-- Wave pattern inside -->
    <g fill="#818cf8">
      <rect x="18" y="30" width="4" height="4"/>
      <rect x="22" y="26" width="4" height="4"/>
      <rect x="26" y="30" width="4" height="4"/>
      <rect x="30" y="34" width="4" height="4"/>
      <rect x="34" y="28" width="4" height="4"/>
      <rect x="38" y="24" width="4" height="4"/>
      <rect x="42" y="30" width="4" height="4"/>
    </g>
    <!-- Anomaly spike (red) -->
    <rect x="30" y="20" width="4" height="8" fill="#ef4444"/>
    <rect x="30" y="16" width="4" height="4" fill="#fca5a5"/>
    <!-- Ball shine -->
    <rect x="16" y="16" width="8" height="8" fill="#a5b4fc" opacity="0.4"/>
    <!-- Glow effect -->
    <rect x="4" y="4" width="56" height="56" fill="#818cf8" opacity="0.15"/>
  </g>

  <!-- Anomaly monsters appearing -->
  <g transform="translate(30, 100)">
    <!-- Small monster -->
    <rect x="0" y="8" width="24" height="24" fill="#7f1d1d"/>
    <rect x="4" y="12" width="16" height="16" fill="#dc2626"/>
    <!-- Eyes -->
    <rect x="6" y="16" width="4" height="4" fill="#fef08a"/>
    <rect x="14" y="16" width="4" height="4" fill="#fef08a"/>
    <!-- Spiky top -->
    <rect x="4" y="4" width="4" height="8" fill="#dc2626"/>
    <rect x="10" y="0" width="4" height="12" fill="#dc2626"/>
    <rect x="16" y="4" width="4" height="8" fill="#dc2626"/>
  </g>

  <g transform="translate(280, 110)">
    <!-- Another monster -->
    <rect x="0" y="8" width="20" height="20" fill="#7f1d1d"/>
    <rect x="4" y="12" width="12" height="12" fill="#dc2626"/>
    <!-- Single eye -->
    <rect x="8" y="16" width="6" height="6" fill="#fef08a"/>
    <rect x="10" y="18" width="2" height="2" fill="#1a1a2e"/>
  </g>

  <!-- Floor/ground -->
  <rect x="0" y="170" width="320" height="30" fill="#1e1b4b"/>
  <g fill="#312e81">
    <rect x="10" y="175" width="20" height="4"/>
    <rect x="60" y="178" width="30" height="4"/>
    <rect x="120" y="175" width="25" height="4"/>
    <rect x="180" y="178" width="35" height="4"/>
    <rect x="250" y="175" width="20" height="4"/>
    <rect x="290" y="178" width="25" height="4"/>
  </g>

  <!-- Candles -->
  <g transform="translate(70, 145)">
    <rect x="0" y="8" width="8" height="16" fill="#fef3c7"/>
    <rect x="2" y="4" width="4" height="6" fill="#f97316"/>
    <rect x="3" y="0" width="2" height="5" fill="#fbbf24"/>
  </g>
  <g transform="translate(160, 148)">
    <rect x="0" y="8" width="8" height="14" fill="#fef3c7"/>
    <rect x="2" y="4" width="4" height="6" fill="#f97316"/>
    <rect x="3" y="0" width="2" height="5" fill="#fbbf24"/>
  </g>

  <!-- Magic dust particles -->
  <g fill="#c4b5fd" opacity="0.7">
    <rect x="140" y="60" width="3" height="3"/>
    <rect x="165" y="80" width="3" height="3"/>
    <rect x="90" y="55" width="3" height="3"/>
    <rect x="175" y="65" width="3" height="3"/>
    <rect x="120" y="85" width="3" height="3"/>
  </g>
</svg>