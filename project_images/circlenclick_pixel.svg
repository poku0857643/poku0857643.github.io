<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
  </defs>
  <!-- Background - Mystery dungeon -->
  <rect width="320" height="200" fill="url(#bg3)"/>

  <!-- Stone floor -->
  <g fill="#3d3d5c">
    <rect x="0" y="160" width="32" height="40"/>
    <rect x="64" y="160" width="32" height="40"/>
    <rect x="128" y="160" width="32" height="40"/>
    <rect x="192" y="160" width="32" height="40"/>
    <rect x="256" y="160" width="32" height="40"/>
  </g>
  <g fill="#4a4a6a">
    <rect x="32" y="160" width="32" height="40"/>
    <rect x="96" y="160" width="32" height="40"/>
    <rect x="160" y="160" width="32" height="40"/>
    <rect x="224" y="160" width="32" height="40"/>
    <rect x="288" y="160" width="32" height="40"/>
  </g>

  <!-- Detective character -->
  <g transform="translate(130, 70)">
    <!-- Body/Coat -->
    <rect x="4" y="32" width="32" height="48" fill="#5d4e37"/>
    <rect x="8" y="36" width="24" height="40" fill="#6b5b45"/>
    <!-- Head -->
    <rect x="8" y="8" width="24" height="24" fill="#ffccbc"/>
    <!-- Detective hat -->
    <rect x="4" y="-4" width="32" height="16" fill="#4a3728"/>
    <rect x="0" y="8" width="40" height="8" fill="#5d4e37"/>
    <!-- Eyes -->
    <rect x="12" y="16" width="4" height="4" fill="#333"/>
    <rect x="24" y="16" width="4" height="4" fill="#333"/>
    <!-- Magnifying glass -->
    <rect x="40" y="40" width="24" height="24" fill="none" stroke="#ffd700" stroke-width="4"/>
    <rect x="60" y="60" width="16" height="6" fill="#8B4513" transform="rotate(45, 68, 63)"/>
    <!-- Glass shine -->
    <rect x="46" y="46" width="8" height="8" fill="#87ceeb" opacity="0.5"/>
  </g>

  <!-- Scrolls being examined -->
  <g transform="translate(60, 100)">
    <!-- Scroll 1 - True (green glow) -->
    <rect x="0" y="0" width="32" height="24" fill="#f5deb3"/>
    <rect x="0" y="0" width="8" height="24" fill="#deb887"/>
    <rect x="24" y="0" width="8" height="24" fill="#deb887"/>
    <!-- Text lines -->
    <rect x="10" y="6" width="12" height="2" fill="#333"/>
    <rect x="10" y="10" width="10" height="2" fill="#333"/>
    <rect x="10" y="14" width="14" height="2" fill="#333"/>
    <!-- Green check glow -->
    <rect x="-4" y="-4" width="40" height="32" fill="#22c55e" opacity="0.2"/>
  </g>

  <g transform="translate(220, 90)">
    <!-- Scroll 2 - False (red glow) -->
    <rect x="0" y="0" width="28" height="20" fill="#f5deb3"/>
    <rect x="0" y="0" width="6" height="20" fill="#deb887"/>
    <rect x="22" y="0" width="6" height="20" fill="#deb887"/>
    <!-- Text lines -->
    <rect x="8" y="5" width="12" height="2" fill="#333"/>
    <rect x="8" y="9" width="10" height="2" fill="#333"/>
    <!-- Red X glow -->
    <rect x="-4" y="-4" width="36" height="28" fill="#ef4444" opacity="0.2"/>
  </g>

  <!-- Truth/Lie detector orbs -->
  <!-- True orb -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="24" height="24" fill="#166534"/>
    <rect x="4" y="4" width="16" height="16" fill="#22c55e"/>
    <rect x="8" y="8" width="8" height="8" fill="#86efac"/>
    <!-- Checkmark -->
    <rect x="6" y="12" width="4" height="4" fill="#fff"/>
    <rect x="10" y="8" width="4" height="8" fill="#fff"/>
  </g>

  <!-- False orb -->
  <g transform="translate(260, 40)">
    <rect x="0" y="0" width="24" height="24" fill="#991b1b"/>
    <rect x="4" y="4" width="16" height="16" fill="#ef4444"/>
    <rect x="8" y="8" width="8" height="8" fill="#fca5a5"/>
    <!-- X mark -->
    <rect x="8" y="8" width="4" height="4" fill="#fff"/>
    <rect x="12" y="12" width="4" height="4" fill="#fff"/>
    <rect x="12" y="8" width="4" height="4" fill="#fff"/>
    <rect x="8" y="12" width="4" height="4" fill="#fff"/>
  </g>

  <!-- Floating question mark orbs -->
  <g transform="translate(100, 30)">
    <rect x="0" y="0" width="16" height="16" fill="#854d0e"/>
    <rect x="2" y="2" width="12" height="12" fill="#eab308"/>
    <!-- ? mark -->
    <rect x="6" y="4" width="4" height="2" fill="#fff"/>
    <rect x="8" y="6" width="2" height="2" fill="#fff"/>
    <rect x="6" y="8" width="2" height="2" fill="#fff"/>
    <rect x="6" y="11" width="2" height="2" fill="#fff"/>
  </g>

  <g transform="translate(200, 35)">
    <rect x="0" y="0" width="16" height="16" fill="#854d0e"/>
    <rect x="2" y="2" width="12" height="12" fill="#eab308"/>
    <rect x="6" y="4" width="4" height="2" fill="#fff"/>
    <rect x="8" y="6" width="2" height="2" fill="#fff"/>
    <rect x="6" y="8" width="2" height="2" fill="#fff"/>
    <rect x="6" y="11" width="2" height="2" fill="#fff"/>
  </g>

  <!-- Magic particles -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="80" y="60" width="4" height="4"/>
    <rect x="240" y="70" width="4" height="4"/>
    <rect x="160" y="50" width="4" height="4"/>
    <rect x="300" y="100" width="4" height="4"/>
    <rect x="20" y="90" width="4" height="4"/>
  </g>

  <!-- Torch on wall -->
  <g transform="translate(20, 60)">
    <rect x="4" y="20" width="8" height="24" fill="#5d4e37"/>
    <rect x="0" y="8" width="16" height="16" fill="#f97316"/>
    <rect x="4" y="4" width="8" height="8" fill="#fbbf24"/>
    <rect x="6" y="0" width="4" height="6" fill="#fef3c7"/>
  </g>

  <g transform="translate(284, 60)">
    <rect x="4" y="20" width="8" height="24" fill="#5d4e37"/>
    <rect x="0" y="8" width="16" height="16" fill="#f97316"/>
    <rect x="4" y="4" width="8" height="8" fill="#fbbf24"/>
    <rect x="6" y="0" width="4" height="6" fill="#fef3c7"/>
  </g>
</svg>