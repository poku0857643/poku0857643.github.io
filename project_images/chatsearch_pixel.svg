<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="320" height="200" fill="url(#bg8)"/>

  <!-- Bridge between kingdoms -->
  <rect x="100" y="140" width="120" height="20" fill="#5d4e37"/>
  <rect x="104" y="144" width="112" height="4" fill="#6b5b45"/>
  <!-- Bridge rails -->
  <g fill="#4a3728">
    <rect x="110" y="130" width="4" height="14"/>
    <rect x="140" y="130" width="4" height="14"/>
    <rect x="176" y="130" width="4" height="14"/>
    <rect x="206" y="130" width="4" height="14"/>
  </g>

  <!-- Left Kingdom (English/Western style) -->
  <g transform="translate(10, 60)">
    <!-- Castle tower -->
    <rect x="20" y="40" width="50" height="60" fill="#4a5568"/>
    <rect x="30" y="20" width="30" height="30" fill="#5a6578"/>
    <rect x="35" y="0" width="20" height="24" fill="#4a5568"/>
    <!-- Tower top -->
    <rect x="38" y="-8" width="14" height="10" fill="#dc2626"/>
    <!-- Windows -->
    <rect x="40" y="6" width="8" height="10" fill="#fef08a"/>
    <rect x="35" y="30" width="8" height="10" fill="#fef08a"/>
    <rect x="47" y="30" width="8" height="10" fill="#fef08a"/>
    <!-- Door -->
    <rect x="35" y="70" width="20" height="30" fill="#3d2914"/>
    <!-- Flag with "A" -->
    <rect x="52" y="-20" width="2" height="20" fill="#5d4e37"/>
    <rect x="54" y="-20" width="16" height="12" fill="#3b82f6"/>
  </g>

  <!-- Right Kingdom (Chinese/Eastern style) -->
  <g transform="translate(230, 55)">
    <!-- Pagoda base -->
    <rect x="10" y="60" width="60" height="40" fill="#7c2d12"/>
    <!-- Tier 1 -->
    <rect x="5" y="55" width="70" height="10" fill="#991b1b"/>
    <rect x="15" y="40" width="50" height="20" fill="#7c2d12"/>
    <!-- Tier 2 -->
    <rect x="10" y="35" width="60" height="10" fill="#991b1b"/>
    <rect x="20" y="20" width="40" height="20" fill="#7c2d12"/>
    <!-- Tier 3 -->
    <rect x="15" y="15" width="50" height="8" fill="#991b1b"/>
    <rect x="25" y="0" width="30" height="18" fill="#7c2d12"/>
    <!-- Top roof -->
    <rect x="20" y="-5" width="40" height="8" fill="#991b1b"/>
    <!-- Spire -->
    <rect x="38" y="-15" width="4" height="12" fill="#fbbf24"/>
    <!-- Windows/doors -->
    <rect x="30" y="70" width="20" height="25" fill="#1a1a2e"/>
    <rect x="30" y="45" width="8" height="8" fill="#fef08a"/>
    <rect x="42" y="45" width="8" height="8" fill="#fef08a"/>
  </g>

  <!-- Translator NPC in middle -->
  <g transform="translate(140, 80)">
    <!-- Robe (mixed style) -->
    <rect x="4" y="28" width="32" height="48" fill="#6b21a8"/>
    <rect x="8" y="32" width="24" height="40" fill="#7c3aed"/>
    <!-- Decorative sash -->
    <rect x="4" y="40" width="32" height="8" fill="#fbbf24"/>
    <!-- Head -->
    <rect x="10" y="8" width="20" height="20" fill="#ffccbc"/>
    <!-- Hat (mixed style) -->
    <rect x="6" y="-4" width="28" height="16" fill="#4c1d95"/>
    <rect x="14" y="-12" width="12" height="12" fill="#4c1d95"/>
    <!-- Eyes (wise) -->
    <rect x="14" y="16" width="4" height="4" fill="#333"/>
    <rect x="22" y="16" width="4" height="4" fill="#333"/>
    <!-- Staff -->
    <rect x="38" y="20" width="4" height="60" fill="#92400e"/>
    <rect x="36" y="12" width="8" height="12" fill="#fbbf24"/>
  </g>

  <!-- Floating English letters (left side) -->
  <g fill="#60a5fa" opacity="0.8">
    <text x="40" y="50" font-size="16" font-family="serif" font-weight="bold">A</text>
    <text x="70" y="40" font-size="12" font-family="serif" font-weight="bold">B</text>
    <text x="55" y="65" font-size="14" font-family="serif" font-weight="bold">C</text>
  </g>

  <!-- Floating Chinese characters (right side) -->
  <g fill="#f87171" opacity="0.8">
    <text x="250" y="45" font-size="14" font-family="serif">中</text>
    <text x="275" y="38" font-size="12" font-family="serif">文</text>
    <text x="260" y="60" font-size="16" font-family="serif">字</text>
  </g>

  <!-- Magic translation particles flowing -->
  <g fill="#c4b5fd">
    <rect x="95" y="90" width="4" height="4"/>
    <rect x="110" y="100" width="4" height="4"/>
    <rect x="125" y="95" width="4" height="4"/>
    <rect x="190" y="95" width="4" height="4"/>
    <rect x="205" y="100" width="4" height="4"/>
    <rect x="220" y="90" width="4" height="4"/>
  </g>

  <!-- Translation beam -->
  <rect x="100" y="105" width="120" height="4" fill="#a78bfa" opacity="0.4"/>
  <rect x="110" y="107" width="100" height="2" fill="#c4b5fd" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="160" width="100" height="40" fill="#2d4a3e"/>
  <rect x="220" y="160" width="100" height="40" fill="#2d4a3e"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="160" y="15" width="2" height="2"/>
    <rect x="130" y="25" width="2" height="2"/>
    <rect x="190" y="20" width="2" height="2"/>
    <rect x="150" y="35" width="2" height="2"/>
    <rect x="170" y="30" width="2" height="2"/>
  </g>
</svg>