<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background - Night watch -->
  <rect width="320" height="200" fill="url(#bg9)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="20" y="15" width="2" height="2"/>
    <rect x="60" y="25" width="2" height="2"/>
    <rect x="100" y="10" width="2" height="2"/>
    <rect x="150" y="20" width="2" height="2"/>
    <rect x="200" y="12" width="2" height="2"/>
    <rect x="250" y="22" width="2" height="2"/>
    <rect x="290" y="18" width="2" height="2"/>
  </g>

  <!-- Moon -->
  <g transform="translate(270, 20)">
    <rect x="0" y="0" width="24" height="24" fill="#fef3c7"/>
    <rect x="4" y="4" width="16" height="16" fill="#fef9c3"/>
  </g>

  <!-- Castle walls -->
  <rect x="0" y="130" width="100" height="70" fill="#475569"/>
  <rect x="220" y="130" width="100" height="70" fill="#475569"/>
  <!-- Wall details -->
  <g fill="#64748b">
    <rect x="10" y="140" width="20" height="20"/>
    <rect x="50" y="140" width="20" height="20"/>
    <rect x="240" y="140" width="20" height="20"/>
    <rect x="280" y="140" width="20" height="20"/>
  </g>

  <!-- Watchtower (center) -->
  <g transform="translate(120, 20)">
    <!-- Tower base -->
    <rect x="10" y="100" width="60" height="80" fill="#334155"/>
    <rect x="20" y="120" width="40" height="50" fill="#1e293b"/>
    <!-- Tower top -->
    <rect x="5" y="80" width="70" height="24" fill="#475569"/>
    <rect x="15" y="60" width="50" height="24" fill="#475569"/>
    <rect x="25" y="40" width="30" height="24" fill="#475569"/>
    <!-- Roof -->
    <rect x="30" y="20" width="20" height="24" fill="#991b1b"/>
    <rect x="35" y="10" width="10" height="14" fill="#991b1b"/>
    <!-- Flag -->
    <rect x="42" y="0" width="2" height="14" fill="#5d4e37"/>
    <rect x="44" y="0" width="12" height="8" fill="#fbbf24"/>
    <!-- Windows with light -->
    <rect x="30" y="90" width="20" height="24" fill="#fef08a"/>
    <rect x="35" y="70" width="10" height="10" fill="#fef08a"/>
  </g>

  <!-- Guardian character in tower -->
  <g transform="translate(155, 95)">
    <!-- Armor body -->
    <rect x="0" y="12" width="20" height="20" fill="#64748b"/>
    <rect x="4" y="14" width="12" height="14" fill="#94a3b8"/>
    <!-- Helmet -->
    <rect x="2" y="0" width="16" height="14" fill="#475569"/>
    <rect x="6" y="4" width="8" height="8" fill="#0f172a"/>
    <!-- Eyes (glowing, alert) -->
    <rect x="7" y="6" width="2" height="2" fill="#fbbf24"/>
    <rect x="11" y="6" width="2" height="2" fill="#fbbf24"/>
    <!-- Spear -->
    <rect x="20" y="-10" width="3" height="40" fill="#92400e"/>
    <rect x="18" y="-16" width="7" height="8" fill="#94a3b8"/>
  </g>

  <!-- Approaching monsters (drift threats) -->
  <g transform="translate(30, 90)">
    <!-- Monster 1 -->
    <rect x="0" y="8" width="20" height="20" fill="#7f1d1d"/>
    <rect x="4" y="12" width="12" height="12" fill="#dc2626"/>
    <!-- Eyes -->
    <rect x="6" y="16" width="3" height="3" fill="#fef08a"/>
    <rect x="13" y="16" width="3" height="3" fill="#fef08a"/>
    <!-- Spikes -->
    <rect x="6" y="4" width="3" height="6" fill="#dc2626"/>
    <rect x="13" y="4" width="3" height="6" fill="#dc2626"/>
  </g>

  <g transform="translate(60, 105)">
    <!-- Monster 2 (smaller) -->
    <rect x="0" y="4" width="14" height="14" fill="#7f1d1d"/>
    <rect x="3" y="7" width="8" height="8" fill="#dc2626"/>
    <!-- Single eye -->
    <rect x="6" y="10" width="4" height="4" fill="#fef08a"/>
  </g>

  <g transform="translate(260, 95)">
    <!-- Monster 3 -->
    <rect x="0" y="8" width="18" height="18" fill="#7f1d1d"/>
    <rect x="3" y="11" width="12" height="12" fill="#dc2626"/>
    <!-- Eyes -->
    <rect x="5" y="15" width="3" height="3" fill="#fef08a"/>
    <rect x="12" y="15" width="3" height="3" fill="#fef08a"/>
  </g>

  <!-- Alarm bells -->
  <g transform="translate(100, 55)">
    <rect x="0" y="0" width="12" height="4" fill="#92400e"/>
    <rect x="2" y="4" width="8" height="12" fill="#fbbf24"/>
    <rect x="4" y="12" width="4" height="4" fill="#92400e"/>
    <!-- Sound waves -->
    <rect x="14" y="6" width="4" height="2" fill="#fef08a" opacity="0.6"/>
    <rect x="20" y="4" width="4" height="2" fill="#fef08a" opacity="0.4"/>
    <rect x="-6" y="6" width="4" height="2" fill="#fef08a" opacity="0.6"/>
    <rect x="-12" y="4" width="4" height="2" fill="#fef08a" opacity="0.4"/>
  </g>

  <g transform="translate(210, 50)">
    <rect x="0" y="0" width="12" height="4" fill="#92400e"/>
    <rect x="2" y="4" width="8" height="12" fill="#fbbf24"/>
    <rect x="4" y="12" width="4" height="4" fill="#92400e"/>
    <!-- Sound waves -->
    <rect x="14" y="6" width="4" height="2" fill="#fef08a" opacity="0.6"/>
    <rect x="20" y="4" width="4" height="2" fill="#fef08a" opacity="0.4"/>
  </g>

  <!-- Warning signals (floating exclamation marks) -->
  <g fill="#dc2626">
    <rect x="50" y="70" width="6" height="14" />
    <rect x="50" y="88" width="6" height="6" />
  </g>
  <g fill="#dc2626">
    <rect x="270" y="75" width="6" height="14" />
    <rect x="270" y="93" width="6" height="6" />
  </g>

  <!-- Ground -->
  <rect x="100" y="180" width="120" height="20" fill="#1e3a3a"/>

  <!-- Glow from tower -->
  <rect x="130" y="100" width="60" height="80" fill="#fef08a" opacity="0.1"/>
</svg>