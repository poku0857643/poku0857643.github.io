<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
  </defs>
  <!-- Background - Blacksmith forge -->
  <rect width="320" height="200" fill="url(#bg10)"/>

  <!-- Stone floor -->
  <rect x="0" y="160" width="320" height="40" fill="#4a4a4a"/>
  <g fill="#3a3a3a">
    <rect x="0" y="160" width="32" height="40"/>
    <rect x="64" y="160" width="32" height="40"/>
    <rect x="128" y="160" width="32" height="40"/>
    <rect x="192" y="160" width="32" height="40"/>
    <rect x="256" y="160" width="32" height="40"/>
  </g>

  <!-- Forge fire -->
  <g transform="translate(20, 80)">
    <!-- Forge structure -->
    <rect x="0" y="40" width="80" height="40" fill="#5d4e37"/>
    <rect x="4" y="20" width="72" height="24" fill="#7f1d1d"/>
    <!-- Fire -->
    <rect x="15" y="28" width="50" height="20" fill="#dc2626"/>
    <rect x="20" y="24" width="40" height="16" fill="#f97316"/>
    <rect x="25" y="20" width="30" height="12" fill="#fbbf24"/>
    <rect x="30" y="14" width="20" height="10" fill="#fef3c7"/>
    <!-- Flames -->
    <rect x="22" y="10" width="6" height="8" fill="#f97316"/>
    <rect x="35" y="6" width="8" height="12" fill="#fbbf24"/>
    <rect x="50" y="10" width="6" height="8" fill="#f97316"/>
    <!-- Chimney -->
    <rect x="30" y="0" width="20" height="20" fill="#4a4a4a"/>
    <!-- Smoke -->
    <rect x="36" y="-10" width="8" height="8" fill="#6b7280" opacity="0.5"/>
    <rect x="38" y="-20" width="6" height="8" fill="#9ca3af" opacity="0.3"/>
  </g>

  <!-- Automation golem 1 -->
  <g transform="translate(120, 90)">
    <!-- Body (metallic) -->
    <rect x="4" y="24" width="32" height="40" fill="#475569"/>
    <rect x="8" y="28" width="24" height="32" fill="#64748b"/>
    <!-- Head -->
    <rect x="8" y="4" width="24" height="20" fill="#475569"/>
    <rect x="12" y="8" width="16" height="12" fill="#1e293b"/>
    <!-- Eyes (glowing) -->
    <rect x="14" y="10" width="4" height="4" fill="#22c55e"/>
    <rect x="22" y="10" width="4" height="4" fill="#22c55e"/>
    <!-- Arms working -->
    <rect x="-8" y="32" width="12" height="8" fill="#475569"/>
    <rect x="36" y="28" width="12" height="8" fill="#475569"/>
    <!-- Hammer in hand -->
    <rect x="44" y="20" width="8" height="20" fill="#92400e"/>
    <rect x="42" y="16" width="12" height="8" fill="#6b7280"/>
    <!-- Gear symbol on chest -->
    <rect x="16" y="36" width="8" height="8" fill="#fbbf24"/>
  </g>

  <!-- Automation golem 2 (smaller) -->
  <g transform="translate(200, 100)">
    <rect x="2" y="16" width="24" height="32" fill="#475569"/>
    <rect x="5" y="19" width="18" height="26" fill="#64748b"/>
    <rect x="5" y="2" width="18" height="16" fill="#475569"/>
    <rect x="8" y="5" width="12" height="10" fill="#1e293b"/>
    <!-- Eyes -->
    <rect x="9" y="7" width="3" height="3" fill="#22c55e"/>
    <rect x="15" y="7" width="3" height="3" fill="#22c55e"/>
    <!-- Carrying materials -->
    <rect x="26" y="24" width="16" height="12" fill="#92400e"/>
  </g>

  <!-- Training dummies -->
  <g transform="translate(260, 70)">
    <!-- Dummy stand -->
    <rect x="12" y="60" width="8" height="30" fill="#5d4e37"/>
    <rect x="8" y="88" width="16" height="8" fill="#5d4e37"/>
    <!-- Target body -->
    <rect x="4" y="20" width="24" height="44" fill="#d4a574"/>
    <rect x="8" y="24" width="16" height="36" fill="#c4956a"/>
    <!-- Target circles -->
    <rect x="10" y="32" width="12" height="12" fill="#dc2626"/>
    <rect x="12" y="34" width="8" height="8" fill="#fef3c7"/>
    <rect x="14" y="36" width="4" height="4" fill="#dc2626"/>
    <!-- Head -->
    <rect x="8" y="4" width="16" height="18" fill="#d4a574"/>
  </g>

  <!-- Weapon upgrade station -->
  <g transform="translate(160, 55)">
    <!-- Anvil -->
    <rect x="0" y="30" width="40" height="20" fill="#4a4a4a"/>
    <rect x="-4" y="26" width="48" height="8" fill="#6b7280"/>
    <rect x="4" y="50" width="12" height="20" fill="#4a4a4a"/>
    <rect x="24" y="50" width="12" height="20" fill="#4a4a4a"/>
    <!-- Sword being forged -->
    <rect x="8" y="18" width="24" height="6" fill="#94a3b8"/>
    <rect x="28" y="20" width="16" height="4" fill="#cbd5e1"/>
    <!-- Sparks -->
    <rect x="20" y="12" width="3" height="3" fill="#fbbf24"/>
    <rect x="28" y="8" width="3" height="3" fill="#f97316"/>
    <rect x="14" y="10" width="3" height="3" fill="#fef3c7"/>
    <rect x="36" y="14" width="3" height="3" fill="#fbbf24"/>
  </g>

  <!-- Command line terminal display -->
  <g transform="translate(80, 15)">
    <rect x="0" y="0" width="160" height="50" fill="#1e293b"/>
    <rect x="4" y="4" width="152" height="42" fill="#0f172a"/>
    <!-- Terminal text -->
    <rect x="8" y="8" width="4" height="6" fill="#22c55e"/>
    <rect x="14" y="8" width="60" height="6" fill="#22c55e"/>
    <rect x="8" y="18" width="4" height="6" fill="#22c55e"/>
    <rect x="14" y="18" width="80" height="6" fill="#22c55e"/>
    <rect x="8" y="28" width="4" height="6" fill="#22c55e"/>
    <rect x="14" y="28" width="40" height="6" fill="#22c55e"/>
    <!-- Cursor -->
    <rect x="8" y="38" width="6" height="6" fill="#22c55e"/>
  </g>

  <!-- Weapon rack -->
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="8" height="40" fill="#5d4e37"/>
    <!-- Swords -->
    <rect x="10" y="5" width="4" height="20" fill="#94a3b8"/>
    <rect x="10" y="25" width="6" height="8" fill="#92400e"/>
    <rect x="20" y="8" width="4" height="18" fill="#94a3b8"/>
    <rect x="20" y="26" width="6" height="8" fill="#92400e"/>
  </g>

  <!-- Progress bars (upgrade progress) -->
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="50" height="10" fill="#1e293b"/>
    <rect x="2" y="2" width="30" height="6" fill="#22c55e"/>
    <rect x="0" y="14" width="50" height="10" fill="#1e293b"/>
    <rect x="2" y="16" width="40" height="6" fill="#3b82f6"/>
    <rect x="0" y="28" width="50" height="10" fill="#1e293b"/>
    <rect x="2" y="30" width="20" height="6" fill="#f97316"/>
  </g>

  <!-- Sparks flying around -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="100" y="60" width="3" height="3"/>
    <rect x="180" y="45" width="3" height="3"/>
    <rect x="140" y="75" width="3" height="3"/>
    <rect x="220" y="55" width="3" height="3"/>
  </g>
</svg>